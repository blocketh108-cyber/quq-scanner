<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QUQ Alpha 扫描器</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0;padding:20px;max-width:1400px;margin:0 auto}
h1{color:#fff;margin-bottom:8px;font-size:24px}
.subtitle{color:#9ca3af;margin-bottom:20px;font-size:14px}
.input-section{background:#1a1a2e;border:1px solid #333;border-radius:12px;padding:24px;margin-bottom:24px}
.input-section label{color:#fff;font-size:14px;display:block;margin-bottom:8px}
textarea{width:100%;height:180px;background:#111827;border:1px solid #374151;border-radius:10px;color:#fff;font-family:monospace;font-size:13px;padding:12px;resize:vertical}
textarea::placeholder{color:#555}
.controls{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.controls input[type=date]{padding:9px 12px;border-radius:10px;border:1px solid #374151;background:#111827;color:#fff;font-size:14px}
.btn{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#059669;color:#fff}.btn-secondary:hover{background:#047857}
.btn-quq{background:#dc2626;color:#fff}.btn-quq:hover{background:#b91c1c}
.btn-primary:disabled,.btn-secondary:disabled,.btn-quq:disabled{opacity:.5;cursor:not-allowed}
.btn-mini{padding:4px 10px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:#334155;color:#93c5fd;transition:all .15s}
.btn-mini:hover{background:#475569;color:#fff}
.btn-mini:disabled{opacity:.4;cursor:not-allowed}
.btn-mini.loading{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hint{color:#666;font-size:12px;margin-top:8px}
.cb-label{color:#9ca3af;font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-label input{accent-color:#2563eb}

.progress-section{display:none;background:#1a1a2e;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:24px}
.progress-bar-outer{width:100%;height:24px;background:#252540;border-radius:12px;overflow:hidden;margin:10px 0}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,#2563eb,#4ade80);border-radius:12px;transition:width .3s;min-width:0}
.progress-text{color:#9ca3af;font-size:13px;text-align:center}

.stat-cards{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px}
.stat-card{background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:15px 25px;min-width:140px}
.stat-card .label{color:#888;font-size:13px;margin-bottom:5px}
.stat-card .value{color:#fff;font-size:22px;font-weight:bold}
.stat-card .value.green{color:#4ade80}.stat-card .value.red{color:#f87171}.stat-card .value.blue{color:#60a5fa}

.results-section{display:none}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search-input,.sort-select{padding:9px 12px;border-radius:10px;border:1px solid #374151;background:#111827;color:#fff;font-size:14px}

table{width:100%;border-collapse:collapse;background:#1a1a2e;border-radius:10px;overflow:hidden}
th{background:#252540;color:#fff;padding:12px 10px;text-align:left;font-size:12px;border-bottom:1px solid #333;white-space:nowrap}
td{padding:10px;font-size:13px;border-bottom:1px solid #222}
tr:hover{background:#252540}
.addr{color:#60a5fa;font-size:11px;word-break:break-all}
.usdt{color:#4ade80}.wear{color:#facc15}
.bal{color:#93c5fd;font-size:12px}
.bal.fresh{animation:flash .6s}
@keyframes flash{0%{color:#4ade80}100%{color:#93c5fd}}
.high{background:#16a34a;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px}
.zero{color:#555}
.error-msg{color:#f87171;margin-top:12px;font-size:14px}
</style></head><body>
<h1>🦞 QUQ Alpha 扫描器</h1>
<div class="subtitle">粘贴 BSC 地址，扫描当天 QUQ 交易磨损数据</div>

<div class="input-section">
  <label>地址列表（每行一个，最多 1000 个）</label>
  <textarea id="addrInput" placeholder="0x1234...&#10;0x5678...&#10;每行一个 BSC 地址"></textarea>
  <div class="controls">
    <label style="color:#9ca3af;font-size:13px">扫描日期：</label>
    <input type="date" id="dayInput">
    <label class="cb-label"><input type="checkbox" id="balCheck" checked> 同时查余额</label>
    <button class="btn btn-primary" id="scanBtnU" onclick="startScan('u')">🔍 U 算法扫描</button>
    <button class="btn btn-quq" id="scanBtnQuq" onclick="startScan('quq')">🦞 QUQ 算法扫描</button>
    <button class="btn btn-secondary" id="refreshBtn" onclick="refreshBalances()">💰 全部刷新余额</button>
  </div>
  <div class="hint">交易日窗口：选择日期的 08:00 → 次日 08:00（UTC+8） · <b>U 算法</b>=USDT 返现旧逻辑（含非QUQ rebate）· <b>QUQ 算法</b>=v6 真实磨损（仅 swap，扣本金注入，剥离首笔卖空领）· 每行地址有单独🔄刷新按钮</div>
</div>

<div class="progress-section" id="progressSection">
  <div style="color:#fff;font-size:15px;font-weight:600" id="progressTitle">扫描中...</div>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="results-section" id="resultsSection">
  <div class="stat-cards">
    <div class="stat-card"><div class="label">活跃地址</div><div class="value" id="statActive">-</div></div>
    <div class="stat-card"><div class="label">总买入</div><div class="value green" id="statBuy">-</div></div>
    <div class="stat-card"><div class="label">总卖出</div><div class="value" id="statSell">-</div></div>
    <div class="stat-card"><div class="label">USDT磨损</div><div class="value red" id="statWear">-</div></div>
    <div class="stat-card"><div class="label">BNB笔数</div><div class="value" id="statBnbTx" style="color:#f0b90b">-</div></div>
    <div class="stat-card"><div class="label">BNB消耗</div><div class="value" id="statBnbGas" style="color:#f0b90b">-</div></div>
    <div class="stat-card"><div class="label">Gas折U</div><div class="value red" id="statBnbUsdt">-</div></div>
    <div class="stat-card"><div class="label">总磨损(含Gas)</div><div class="value red" id="statTotalWear">-</div></div>
    <div class="stat-card" id="balCard" style="display:none"><div class="label">总余额 (U)</div><div class="value blue" id="statBal">-</div></div>
  </div>
  <div class="toolbar">
    <input id="searchInput" class="search-input" placeholder="搜索地址" oninput="renderTable()">
    <select id="sortSelect" class="sort-select" onchange="renderTable()">
      <option value="order">输入顺序</option>
      <option value="points_desc">积分从高到低</option>
      <option value="wear_desc">磨损绝对值从高到低</option>
      <option value="buy_desc">买入从高到低</option>
      <option value="bal_desc">余额从高到低</option>
    </select>
  </div>
  <table><thead><tr id="tableHead">
    <th>#</th><th>地址</th><th>买入</th><th>卖出</th><th>磨损</th><th>积分</th>
  </tr></thead><tbody id="tableBody"></tbody></table>
</div>

<script>
const now = new Date(Date.now() + 8*3600000);
const h = now.getUTCHours();
const dd = h >= 8 ? now : new Date(now - 86400000);
dayInput.value = dd.toISOString().slice(0,10);

let allResults = [], taskId = null, hasBal = false, balOnly = false, bnbPrice = 600;

// Fetch BNB price on load
fetch('/api/bnb-price').then(r=>r.json()).then(d=>{bnbPrice=d.price||600}).catch(()=>{});

function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function signedMoney(v){const n=Number(v||0);return(n>=0?'+':'-')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtBal(v){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4})}

function getAddresses(){
  return addrInput.value.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);
}

// --- Single row refresh ---
async function refreshRow(addr, idx){
  const btn = document.getElementById('rb-'+idx);
  if(!btn) return;
  btn.disabled=true; btn.classList.add('loading'); btn.textContent='⏳';
  try{
    const res = await fetch('/api/balance/'+addr);
    const bal = await res.json();
    if(!res.ok) throw new Error(bal.detail||'失败');
    // Update allResults
    const r = allResults.find(r=>(r.fullAddr||r.addr||'').toLowerCase()===addr.toLowerCase());
    if(r){
      r.usdt_bal = bal.usdt; r.usdc_bal = bal.usdc;
      r.usd1_bal = bal.usd1; r.bnb_bal = bal.bnb;
    }
    hasBal = true;
    updateStats(); renderTable();
  }catch(e){
    btn.textContent='❌';
    setTimeout(()=>{btn.textContent='🔄';btn.disabled=false;btn.classList.remove('loading')},2000);
    return;
  }
  // After render, the button is recreated, no need to reset
}

function setScanBtnDisabled(d){
  const a=document.getElementById('scanBtnU'),b=document.getElementById('scanBtnQuq');
  if(a)a.disabled=d;if(b)b.disabled=d;refreshBtn.disabled=d;
}
let currentAlgo='u';
async function startScan(algo){
  algo=algo||'u';currentAlgo=algo;
  errorMsg.textContent='';balOnly=false;
  const lines = getAddresses();
  if(!lines.length){errorMsg.textContent='请输入至少一个地址';return}
  if(lines.length>1000){errorMsg.textContent='最多支持 1000 个地址';return}
  setScanBtnDisabled(true);
  const inclBal = balCheck.checked;
  try{
    const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:lines,day:dayInput.value||null,include_balances:inclBal,algo:algo})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||'请求失败');
    taskId=data.task_id;
    progressSection.style.display='block';
    resultsSection.style.display='none';
    progressBar.style.width='0%';
    progressTitle.textContent=(algo==='quq'?'QUQ 算法 ':'U 算法 ')+'扫描中...';
    progressText.textContent=`0 / ${data.total}`;
    pollStatus();
  }catch(e){errorMsg.textContent=String(e);setScanBtnDisabled(false)}
}

async function refreshBalances(){
  errorMsg.textContent='';balOnly=true;
  const lines = getAddresses();
  if(!lines.length){errorMsg.textContent='请输入至少一个地址';return}
  if(lines.length>1000){errorMsg.textContent='最多支持 1000 个地址';return}
  setScanBtnDisabled(true);
  progressSection.style.display='block';
  progressTitle.textContent='查询余额中...';
  progressBar.style.width='50%';
  progressText.textContent=`查询 ${lines.length} 个地址`;
  try{
    const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:lines})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||'请求失败');
    allResults=data.results;hasBal=true;
    progressSection.style.display='none';
    resultsSection.style.display='block';
    updateStats();renderTable();
  }catch(e){errorMsg.textContent=String(e);progressSection.style.display='none'}
  setScanBtnDisabled(false);
}

async function pollStatus(){
  if(!taskId)return;
  try{
    const res=await fetch(`/api/status/${taskId}`);
    const s=await res.json();
    const pct=s.total?Math.round(s.progress/s.total*100):0;
    progressBar.style.width=pct+'%';
    progressText.textContent=`${s.progress} / ${s.total}`;
    progressTitle.textContent=s.status==='running'?'扫描中...':s.status==='queued'?'排队中...':'完成';
    if(s.status==='done'){
      await loadResults();setScanBtnDisabled(false);return;
    }
    if(s.status==='error'){
      errorMsg.textContent=s.error||'扫描失败';setScanBtnDisabled(false);progressSection.style.display='none';return;
    }
  }catch(e){}
  setTimeout(pollStatus,2000);
}

async function loadResults(){
  const res=await fetch(`/api/results/${taskId}`);
  const data=await res.json();
  allResults=data.results||[];
  hasBal=allResults.length>0 && allResults[0].usdt_bal!==undefined;
  progressSection.style.display='none';
  resultsSection.style.display='block';
  updateStats();renderTable();
}

function updateStats(){
  if(balOnly){
    statActive.textContent=allResults.length;
    statBuy.textContent='-';statSell.textContent='-';statWear.textContent='-';
    statBnbTx.textContent='-';statBnbGas.textContent='-';statBnbUsdt.textContent='-';statTotalWear.textContent='-';
  }else{
    let active=0,buy=0,sell=0,wear=0,bnbTx=0,bnbGas=0;
    allResults.forEach(r=>{if(r.points>0)active++;buy+=r.usdt_in||0;sell+=r.usdt_out||0;wear+=r.wear||0;bnbTx+=r.bnb_tx_count||0;bnbGas+=r.bnb_gas_used||0});
    const gasUsdt=bnbGas*bnbPrice;
    const totalWear=wear-gasUsdt;
    statActive.textContent=active;statBuy.textContent=money(buy);statSell.textContent=money(sell);statWear.textContent=signedMoney(wear);
    statBnbTx.textContent=bnbTx.toLocaleString();
    statBnbGas.textContent=bnbGas.toFixed(6)+' BNB';
    statBnbUsdt.textContent=signedMoney(-gasUsdt);
    statTotalWear.textContent=signedMoney(totalWear);
  }
  if(hasBal||balOnly){
    let totalBal=0;
    allResults.forEach(r=>{totalBal+=(r.usdt_bal||r.usdt||0)+(r.usdc_bal||r.usdc||0)+(r.usd1_bal||r.usd1||0)});
    balCard.style.display='';statBal.textContent=money(totalBal);
  }else{balCard.style.display='none'}
}

function renderTable(){
  const showBal=hasBal||balOnly;
  // Build header
  let hdr='<th>#</th><th>地址</th>';
  if(!balOnly) hdr+='<th>买入</th><th>卖出</th><th>磨损</th><th>BNB笔数</th><th>Gas(BNB)</th><th>Gas(U)</th><th>总磨损</th><th>积分</th>';
  if(showBal) hdr+='<th>USDT</th><th>USDC</th><th>USD1</th><th>QUQ</th><th>BNB</th>';
  if(balOnly) hdr+='<th>总余额</th>';
  hdr+='<th>操作</th>';
  tableHead.innerHTML=hdr;

  let rows=allResults.map((r,i)=>({...r,_idx:i}));
  const q=(searchInput.value||'').toLowerCase();
  if(q)rows=rows.filter(r=>(r.fullAddr||r.addr||'').toLowerCase().includes(q));
  const sort=sortSelect.value;
  if(sort==='points_desc')rows.sort((a,b)=>(b.points||0)-(a.points||0));
  else if(sort==='wear_desc')rows.sort((a,b)=>Math.abs(b.wear||0)-Math.abs(a.wear||0));
  else if(sort==='buy_desc')rows.sort((a,b)=>(b.usdt_in||0)-(a.usdt_in||0));
  else if(sort==='bal_desc')rows.sort((a,b)=>{
    const ba=(b.usdt_bal||b.usdt||0)+(b.usdc_bal||b.usdc||0)+(b.usd1_bal||b.usd1||0);
    const aa=(a.usdt_bal||a.usdt||0)+(a.usdc_bal||a.usdc||0)+(a.usd1_bal||a.usd1||0);
    return ba-aa;
  });

  const tbody=tableBody;tbody.innerHTML='';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    const addr=r.fullAddr||r.addr;
    const usdt_b=r.usdt_bal!=null?r.usdt_bal:(r.usdt||0);
    const usdc_b=r.usdc_bal!=null?r.usdc_bal:(r.usdc||0);
    const usd1_b=r.usd1_bal!=null?r.usd1_bal:(r.usd1||0);
    const quq_b=r.quq_bal!=null?r.quq_bal:(r.quq||0);
    const bnb_b=r.bnb_bal!=null?r.bnb_bal:(r.bnb||0);
    const hasBals=r.usdt_bal!=null||r.usdt!=null;
    const freshCls=hasBals?' fresh':'';

    let html=`<td>${i+1}</td><td class="addr">${addr}</td>`;
    if(!balOnly){
      const gasUsdt=(r.bnb_gas_used||0)*bnbPrice;
      const totalWear=(r.wear||0)-gasUsdt;
      html+=`<td class="usdt">${money(r.usdt_in)}</td><td class="usdt">${money(r.usdt_out)}</td><td class="wear">${signedMoney(r.wear)}</td><td>${r.bnb_tx_count||0}</td><td style="color:#f0b90b">${(r.bnb_gas_used||0).toFixed(6)}</td><td class="wear">${signedMoney(-gasUsdt)}</td><td class="wear" style="font-weight:bold">${signedMoney(totalWear)}</td><td><span class="${r.points>0?'high':'zero'}">${r.points}</span></td>`;
    }
    if(showBal){
      html+=`<td class="bal${freshCls}">${fmtBal(usdt_b)}</td><td class="bal${freshCls}">${fmtBal(usdc_b)}</td><td class="bal${freshCls}">${fmtBal(usd1_b)}</td><td class="bal${freshCls}">${fmtBal(quq_b)}</td><td class="bal${freshCls}">${fmtBal(bnb_b)}</td>`;
    }
    if(balOnly){
      const total=usdt_b+usdc_b+usd1_b;
      html+=`<td class="usdt">${money(total)}</td>`;
    }
    html+=`<td><button class="btn-mini" id="rb-${r._idx}" onclick="refreshRow('${addr}',${r._idx})">🔄</button></td>`;
    tr.innerHTML=html;
    tbody.appendChild(tr);
  });
}
</script></body></html>
