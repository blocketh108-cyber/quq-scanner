<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QUQ + QQQB/USDT 扫描器</title><style>
:root{
  --bg:#0a0d14;--card:#141925;--card2:#1a2030;--border:#232c3d;--border2:#303d54;
  --txt:#e6eaf2;--muted:#8893a7;--dim:#566074;
  --blue:#3b82f6;--blue2:#2563eb;--green:#22c55e;--red:#f05252;--yellow:#eab308;--accent:#6366f1;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(99,102,241,.35)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(1100px 560px at 82% -12%,#16213c 0%,transparent 55%),radial-gradient(820px 460px at -8% 2%,#1c1633 0%,transparent 52%),var(--bg);color:var(--txt);padding:30px 22px 60px;max-width:1520px;margin:0 auto;min-height:100vh;-webkit-font-smoothing:antialiased}
h1{color:#fff;margin-bottom:6px;font-size:27px;font-weight:700;letter-spacing:-.6px;display:flex;align-items:center;gap:11px}
.subtitle{color:var(--muted);margin-bottom:26px;font-size:14px}
.input-section{background:linear-gradient(180deg,rgba(26,32,48,.72),rgba(18,23,35,.72));border:1px solid var(--border);border-radius:18px;padding:26px;margin-bottom:24px;backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(0,0,0,.3)}
.input-section label{color:#fff;font-size:13px;font-weight:600;display:block;margin-bottom:9px;letter-spacing:.2px}
textarea{width:100%;height:170px;background:rgba(10,13,20,.7);border:1px solid var(--border);border-radius:12px;color:#fff;font-family:'SF Mono',ui-monospace,monospace;font-size:13px;line-height:1.6;padding:14px;resize:vertical;transition:border-color .18s,box-shadow .18s}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea::placeholder{color:var(--dim)}
.controls{display:flex;gap:11px;align-items:center;margin-top:16px;flex-wrap:wrap}
.controls input[type=date]{padding:10px 13px;border-radius:11px;border:1px solid var(--border);background:rgba(10,13,20,.7);color:#fff;font-size:14px;transition:border-color .18s}
.controls input[type=date]:focus{outline:none;border-color:var(--blue)}
.btn{padding:11px 22px;border-radius:11px;border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s;letter-spacing:.2px}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.32)}.btn-primary:hover{box-shadow:0 9px 24px rgba(37,99,235,.42)}
.btn-secondary{background:linear-gradient(180deg,#10b981,#059669);color:#fff;box-shadow:0 6px 18px rgba(5,150,105,.3)}.btn-secondary:hover{box-shadow:0 9px 24px rgba(5,150,105,.4)}
.btn-quq{background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff;box-shadow:0 6px 18px rgba(220,38,38,.3)}.btn-quq:hover{box-shadow:0 9px 24px rgba(220,38,38,.4)}
.btn-primary:disabled,.btn-secondary:disabled,.btn-quq:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-mini{padding:5px 11px;border-radius:8px;border:1px solid var(--border2);font-size:11px;font-weight:600;cursor:pointer;background:rgba(51,65,85,.5);color:#93c5fd;transition:all .15s}
.btn-mini:hover{background:#475569;color:#fff;border-color:#5a6b85}
.btn-mini:disabled{opacity:.4;cursor:not-allowed}
.btn-mini.loading{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hint{color:var(--dim);font-size:12px;margin-top:12px;line-height:1.7}
.hint b{color:var(--muted);font-weight:600}
.queue-status{margin-top:12px;color:#93c5fd;font-size:12px;background:rgba(15,23,42,.65);border:1px solid var(--border);border-radius:10px;padding:9px 11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.queue-status .warn{color:#facc15}.queue-status .bad{color:#f87171}.queue-status .ok{color:#4ade80}
.cb-label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.cb-label input{accent-color:var(--blue);width:15px;height:15px}

.progress-section{display:none;background:linear-gradient(180deg,rgba(26,32,48,.72),rgba(18,23,35,.72));border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:24px;backdrop-filter:blur(10px)}
.progress-bar-outer{width:100%;height:22px;background:rgba(10,13,20,.7);border-radius:12px;overflow:hidden;margin:12px 0;border:1px solid var(--border)}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:12px;transition:width .3s;min-width:0;box-shadow:0 0 14px rgba(34,197,94,.4)}
.progress-text{color:var(--muted);font-size:13px;text-align:center}
.task-meta{color:#93c5fd;font-size:12px;text-align:center;margin-top:8px}
.btn-cancel{margin-top:12px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.45);color:#fecaca}
.btn-cancel:hover{background:rgba(239,68,68,.25);color:#fff}

.stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.stat-card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:14px;padding:16px 18px;overflow:hidden;transition:transform .15s,border-color .15s}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);opacity:.85}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border2)}
.stat-card .label{color:var(--muted);font-size:12px;margin-bottom:7px;font-weight:500}
.stat-card .value{color:#fff;font-size:23px;font-weight:700;letter-spacing:-.5px}
.stat-card .value.green{color:#4ade80}.stat-card .value.red{color:#f87171}.stat-card .value.blue{color:#60a5fa}
.stat-card .value.green~*,.stat-card:has(.green)::before{background:var(--green)}
.stat-card:has(.red)::before{background:var(--red)}
.stat-card:has(.blue)::before{background:var(--blue)}

.results-section{display:none}
.toolbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-input,.sort-select{padding:10px 13px;border-radius:11px;border:1px solid var(--border);background:rgba(10,13,20,.7);color:#fff;font-size:14px;transition:border-color .18s}
.search-input:focus,.sort-select:focus{outline:none;border-color:var(--blue)}
.search-input{min-width:240px}

.table-wrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.28)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{background:#1d2434;color:#cdd5e3;padding:13px 11px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:11px;font-size:13px;border-bottom:1px solid rgba(35,44,61,.6);white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:nth-child(even){background:rgba(255,255,255,.012)}
tbody tr:hover{background:rgba(59,130,246,.08)}
tbody tr:last-child td{border-bottom:none}
.addr{color:#60a5fa;font-size:11px;word-break:break-all;font-family:'SF Mono',ui-monospace,monospace}
.usdt{color:#4ade80;font-variant-numeric:tabular-nums}.wear{color:#facc15;font-variant-numeric:tabular-nums}
.bal{color:#93c5fd;font-size:12px;font-variant-numeric:tabular-nums}
.bal.fresh{animation:flash .6s}
@keyframes flash{0%{color:#4ade80}100%{color:#93c5fd}}
.high{background:linear-gradient(180deg,#22c55e,#16a34a);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.zero{color:var(--dim)}
.error-msg{color:#f87171;margin-top:12px;font-size:14px}
</style></head><body>
<h1>🦞 QUQ + QQQB/USDT 扫描器</h1>
<div class="subtitle">粘贴 BSC 地址，同时扫描当天 QUQ、QQQB 与 USDT 的交易数据</div>

<div class="input-section">
  <label>地址列表（每行一个，最多 1000 个）</label>
  <textarea id="addrInput" placeholder="0x1234...&#10;0x5678...&#10;每行一个 BSC 地址"></textarea>
  <div class="controls">
    <label style="color:#9ca3af;font-size:13px">扫描日期：</label>
    <input type="date" id="dayInput">
    <label class="cb-label"><input type="checkbox" id="balCheck" checked> 同时查余额</label>
    <button class="btn btn-primary" id="scanBtnU" onclick="startScan('u')">🔍 U 算法扫描</button>
    <button class="btn btn-quq" id="scanBtnQqqb" onclick="startScan('qqqb')">🦞 双币真实磨损扫描</button>
    <button class="btn btn-secondary" id="refreshBtn" onclick="refreshBalances()">💰 全部刷新余额</button>
  </div>
  <div class="hint">交易日窗口：选择日期的 08:00 → 次日 08:00（UTC+8） · 每天同时查 QUQ + QQQB，两种币统一汇总且同哈希不重复 · <b>U 算法</b>=含返现修正 · <b>双币真实磨损</b>=真实 swap 磨损 · 每行地址可单独刷新余额</div>
  <div class="queue-status" id="taskStats">任务槽：读取中...</div>
</div>

<div class="progress-section" id="progressSection">
  <div style="color:#fff;font-size:15px;font-weight:600" id="progressTitle">扫描中...</div>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
  <div class="task-meta" id="taskMeta"></div>
  <div style="text-align:center"><button class="btn btn-cancel" id="cancelTaskBtn" onclick="cancelCurrentTask()">停止当前任务并释放槽位</button></div>
</div>

<div class="error-msg" id="errorMsg"></div>

<div class="results-section" id="resultsSection">
  <div class="stat-cards">
    <div class="stat-card"><div class="label">活跃地址</div><div class="value" id="statActive">-</div></div>
    <div class="stat-card"><div class="label">总买入</div><div class="value green" id="statBuy">-</div></div>
    <div class="stat-card"><div class="label">总卖出</div><div class="value" id="statSell">-</div></div>
    <div class="stat-card"><div class="label">总交易量</div><div class="value green" id="statVolume">-</div></div>
    <div class="stat-card"><div class="label">USDT磨损</div><div class="value red" id="statWear">-</div></div>
    <div class="stat-card"><div class="label">BNB笔数</div><div class="value" id="statBnbTx" style="color:#f0b90b">-</div></div>
    <div class="stat-card"><div class="label">BNB消耗</div><div class="value" id="statBnbGas" style="color:#f0b90b">-</div></div>
    <div class="stat-card"><div class="label">Gas折U</div><div class="value red" id="statBnbUsdt">-</div></div>
    <div class="stat-card"><div class="label">总磨损(含Gas)</div><div class="value red" id="statTotalWear">-</div></div>
    <div class="stat-card" id="balCard" style="display:none"><div class="label">总余额 (U)</div><div class="value blue" id="statBal">-</div></div>
  </div>
  <div class="toolbar">
    <input id="searchInput" class="search-input" placeholder="搜索地址" oninput="renderTable()">
    <select id="sortSelect" class="sort-select" onchange="renderTable()">
      <option value="order">输入顺序</option>
      <option value="points_desc">积分从高到低</option>
      <option value="wear_desc">磨损绝对值从高到低</option>
      <option value="buy_desc">买入从高到低</option>
      <option value="bal_desc">余额从高到低</option>
    </select>
  </div>
  <div class="table-wrap" style="overflow-x:auto">
  <table><thead><tr id="tableHead">
    <th>#</th><th>地址</th><th>买入</th><th>卖出</th><th>磨损</th><th>积分</th>
  </tr></thead><tbody id="tableBody"></tbody></table>
  </div>
</div>

<script>
const now = new Date(Date.now() + 8*3600000);
const h = now.getUTCHours();
const dd = h >= 8 ? now : new Date(now - 86400000);
dayInput.value = dd.toISOString().slice(0,10);

let allResults = [], taskId = null, hasBal = false, balOnly = false, bnbPrice = 600;

// 加载 BNB 价格
fetch('/api/bnb-price').then(r=>r.json()).then(d=>{bnbPrice=d.price||600}).catch(()=>{});

async function refreshTaskStats(){
  try{
    const res=await fetch('/api/tasks');
    const s=await res.json();
    const active=s.active_slots||0,max=s.max_concurrent_tasks||5,avail=s.available_slots||0;
    const cls=active>=max?'bad':active>=Math.max(1,max-1)?'warn':'ok';
    const running=(s.tasks||[]).filter(t=>t.status==='running').slice(0,3)
      .map(t=>`${t.task_id}:${t.progress}/${t.total},闲${t.idle_seconds||0}s`).join(' ｜ ');
    taskStats.innerHTML=`<span class="${cls}">任务槽 ${active}/${max}，可用 ${avail}</span><span>卡死无进度 ${s.task_stale_seconds||300}s 自动释放</span>${running?`<span>运行中：${running}</span>`:''}`;
  }catch(e){taskStats.textContent='任务槽：读取失败'}
}
refreshTaskStats();setInterval(refreshTaskStats,5000);

function money(v){return '$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function signedMoney(v){const n=Number(v||0);return(n>=0?'+':'-')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtBal(v){
  if(v===null||v===undefined)return '数据不可用';
  return Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4});
}
function pickBal(r,fresh,legacy){
  return Object.prototype.hasOwnProperty.call(r,fresh)?r[fresh]:(Object.prototype.hasOwnProperty.call(r,legacy)?r[legacy]:null);
}

function getAddresses(){
  return addrInput.value.trim().split(/\n/).map(l=>l.trim()).filter(Boolean);
}

// --- Single row refresh ---
async function refreshRow(addr, idx){
  const btn = document.getElementById('rb-'+idx);
  if(!btn) return;
  btn.disabled=true; btn.classList.add('loading'); btn.textContent='⏳';
  try{
    const res = await fetch('/api/balance/'+addr);
    const bal = await res.json();
    if(!res.ok) throw new Error(bal.detail||'失败');
    // Update allResults
    const r = allResults.find(r=>(r.fullAddr||r.addr||'').toLowerCase()===addr.toLowerCase());
    if(r){
      r.usdt_bal = bal.usdt; r.usdc_bal = bal.usdc;
      r.usd1_bal = bal.usd1; r.quq_bal = bal.quq; r.qqqb_bal = bal.qqqb; r.bnb_bal = bal.bnb;
      r.balance_error = bal.balance_error||null;
    }
    hasBal = true;
    updateStats(); renderTable();
  }catch(e){
    btn.textContent='❌';
    setTimeout(()=>{btn.textContent='🔄';btn.disabled=false;btn.classList.remove('loading')},2000);
    return;
  }
  // After render, the button is recreated, no need to reset
}

function setScanBtnDisabled(d){
  const a=document.getElementById('scanBtnU'),b=document.getElementById('scanBtnQqqb');
  if(a)a.disabled=d;if(b)b.disabled=d;refreshBtn.disabled=d;
}
let currentAlgo='u';
async function startScan(algo){
  algo=algo||'u';currentAlgo=algo;
  errorMsg.textContent='';balOnly=false;
  const lines = getAddresses();
  if(!lines.length){errorMsg.textContent='请输入至少一个地址';return}
  if(lines.length>1000){errorMsg.textContent='最多支持 1000 个地址';return}
  setScanBtnDisabled(true);
  const inclBal = balCheck.checked;
  try{
    const res=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:lines,day:dayInput.value||null,include_balances:inclBal,algo:algo})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||'请求失败');
    taskId=data.task_id;
    progressSection.style.display='block';
    resultsSection.style.display='none';
    progressBar.style.width='0%';
    progressTitle.textContent=(algo==='qqqb'?'双币真实磨损 ':'U 算法 ')+'扫描中...';
    progressText.textContent=`0 / ${data.total}`;
    taskMeta.textContent=`任务 ${taskId} ｜ 运行槽 ${data.active_slots||0}/${data.max_concurrent_tasks||5}`;
    cancelTaskBtn.disabled=false;
    refreshTaskStats();
    pollStatus();
  }catch(e){errorMsg.textContent=String(e);setScanBtnDisabled(false);refreshTaskStats()}
}

async function refreshBalances(){
  errorMsg.textContent='';balOnly=true;
  const lines = getAddresses();
  if(!lines.length){errorMsg.textContent='请输入至少一个地址';return}
  if(lines.length>1000){errorMsg.textContent='最多支持 1000 个地址';return}
  setScanBtnDisabled(true);
  progressSection.style.display='block';
  progressTitle.textContent='查询余额中...';
  progressBar.style.width='50%';
  progressText.textContent=`查询 ${lines.length} 个地址`;
  try{
    const res=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({addresses:lines})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||'请求失败');
    allResults=data.results;hasBal=true;
    progressSection.style.display='none';
    resultsSection.style.display='block';
    updateStats();renderTable();
  }catch(e){errorMsg.textContent=String(e);progressSection.style.display='none'}
  setScanBtnDisabled(false);
}

async function cancelCurrentTask(){
  if(!taskId)return;
  cancelTaskBtn.disabled=true;
  try{
    const res=await fetch(`/api/cancel/${taskId}`,{method:'POST'});
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||'取消失败');
    errorMsg.textContent='已停止当前任务，槽位已释放';
    progressTitle.textContent='已取消';
    progressSection.style.display='none';
    setScanBtnDisabled(false);
    refreshTaskStats();
  }catch(e){errorMsg.textContent=String(e);cancelTaskBtn.disabled=false}
}

async function pollStatus(){
  if(!taskId)return;
  try{
    const res=await fetch(`/api/status/${taskId}`);
    const s=await res.json();
    const pct=s.total?Math.round(s.progress/s.total*100):0;
    progressBar.style.width=pct+'%';
    progressText.textContent=`${s.progress} / ${s.total}`;
    taskMeta.textContent=`任务 ${taskId} ｜ 运行槽 ${s.active_slots||0}/${s.max_concurrent_tasks||5} ｜ 已跑 ${s.running_seconds||0}s ｜ 闲置 ${s.idle_seconds||0}s`;
    progressTitle.textContent=s.status==='running'?'扫描中...':s.status==='queued'?'排队中...':s.status==='timeout'?'已超时释放':s.status==='cancelled'?'已取消':'完成';
    refreshTaskStats();
    if(s.status==='done'){
      await loadResults();setScanBtnDisabled(false);return;
    }
    if(['error','timeout','cancelled'].includes(s.status)){
      errorMsg.textContent=s.error||'扫描失败';setScanBtnDisabled(false);progressSection.style.display='none';return;
    }
  }catch(e){}
  setTimeout(pollStatus,2000);
}

async function loadResults(){
  const res=await fetch(`/api/results/${taskId}`);
  const data=await res.json();
  allResults=data.results||[];
  hasBal=allResults.length>0 && allResults[0].usdt_bal!==undefined;
  progressSection.style.display='none';
  resultsSection.style.display='block';
  updateStats();renderTable();
}

function updateStats(){
  if(balOnly){
    statActive.textContent=allResults.length;
    statBuy.textContent='-';statSell.textContent='-';statVolume.textContent='-';statWear.textContent='-';
    statBnbTx.textContent='-';statBnbGas.textContent='-';statBnbUsdt.textContent='-';statTotalWear.textContent='-';
  }else{
    let active=0,buy=0,sell=0,wear=0,bnbTx=0,bnbGas=0;
    allResults.forEach(r=>{if(r.points>0)active++;buy+=r.usdt_in||0;sell+=r.usdt_out||0;wear+=r.wear||0;bnbTx+=r.bnb_tx_count||0;bnbGas+=r.bnb_gas_used||0});
    const gasUsdt=bnbGas*bnbPrice;
    const totalWear=wear-gasUsdt;
    statActive.textContent=active;statBuy.textContent=money(buy);statSell.textContent=money(sell);statVolume.textContent=money(buy+sell);statWear.textContent=signedMoney(wear);
    statBnbTx.textContent=bnbTx.toLocaleString();
    statBnbGas.textContent=bnbGas.toFixed(6)+' BNB';
    statBnbUsdt.textContent=signedMoney(-gasUsdt);
    statTotalWear.textContent=signedMoney(totalWear);
  }
  if(hasBal||balOnly){
    let totalBal=0,balanceIncomplete=false;
    allResults.forEach(r=>{
      const vals=[pickBal(r,'usdt_bal','usdt'),pickBal(r,'usdc_bal','usdc'),pickBal(r,'usd1_bal','usd1')];
      if(vals.some(v=>v===null||v===undefined))balanceIncomplete=true;
      totalBal+=vals.reduce((sum,v)=>sum+(v==null?0:Number(v)),0);
    });
    balCard.style.display='';statBal.textContent=(balanceIncomplete?'部分数据：':'')+money(totalBal);
  }else{balCard.style.display='none'}
}

function renderTable(){
  const showBal=hasBal||balOnly;
  // Build header
  let hdr='<th>#</th><th>地址</th>';
  if(!balOnly) hdr+='<th>买入</th><th>卖出</th><th>磨损</th><th>BNB笔数</th><th>Gas(BNB)</th><th>Gas(U)</th><th>总磨损</th><th>积分</th><th>LiFi</th><th>Liquidmesh</th><th>Pancake</th>';
  if(showBal) hdr+='<th>USDT</th><th>USDC</th><th>USD1</th><th>QUQ</th><th>QQQB</th><th>BNB</th>';
  if(balOnly) hdr+='<th>总余额</th>';
  hdr+='<th>操作</th>';
  tableHead.innerHTML=hdr;

  let rows=allResults.map((r,i)=>({...r,_idx:i}));
  const q=(searchInput.value||'').toLowerCase();
  if(q)rows=rows.filter(r=>(r.fullAddr||r.addr||'').toLowerCase().includes(q));
  const sort=sortSelect.value;
  if(sort==='points_desc')rows.sort((a,b)=>(b.points||0)-(a.points||0));
  else if(sort==='wear_desc')rows.sort((a,b)=>Math.abs(b.wear||0)-Math.abs(a.wear||0));
  else if(sort==='buy_desc')rows.sort((a,b)=>(b.usdt_in||0)-(a.usdt_in||0));
  else if(sort==='bal_desc')rows.sort((a,b)=>{
    const ba=(b.usdt_bal||b.usdt||0)+(b.usdc_bal||b.usdc||0)+(b.usd1_bal||b.usd1||0);
    const aa=(a.usdt_bal||a.usdt||0)+(a.usdc_bal||a.usdc||0)+(a.usd1_bal||a.usd1||0);
    return ba-aa;
  });

  const tbody=tableBody;tbody.innerHTML='';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    const addr=r.fullAddr||r.addr;
    const usdt_b=pickBal(r,'usdt_bal','usdt');
    const usdc_b=pickBal(r,'usdc_bal','usdc');
    const usd1_b=pickBal(r,'usd1_bal','usd1');
    const quq_b=pickBal(r,'quq_bal','quq');
    const qqqb_b=pickBal(r,'qqqb_bal','qqqb');
    const bnb_b=pickBal(r,'bnb_bal','bnb');
    const hasBals=Object.prototype.hasOwnProperty.call(r,'usdt_bal')||r.usdt!==undefined;
    const freshCls=hasBals?' fresh':'';

    let html=`<td>${i+1}</td><td class="addr">${addr}</td>`;
    if(!balOnly){
      const gasUsdt=(r.bnb_gas_used||0)*bnbPrice;
      const totalWear=(r.wear||0)-gasUsdt;
      html+=`<td class="usdt">${money(r.usdt_in)}</td><td class="usdt">${money(r.usdt_out)}</td><td class="wear">${signedMoney(r.wear)}</td><td>${r.bnb_tx_count||0}</td><td style="color:#f0b90b">${(r.bnb_gas_used||0).toFixed(6)}</td><td class="wear">${signedMoney(-gasUsdt)}</td><td class="wear" style="font-weight:bold">${signedMoney(totalWear)}</td><td><span class="${r.points>0?'high':'zero'}">${r.points}</span></td><td>${r.v_lifi||0}</td><td>${r.v_liquidmesh||0}</td><td>${r.v_pancake||0}</td>`;
    }
    if(showBal){
      html+=`<td class="bal${freshCls}">${fmtBal(usdt_b)}</td><td class="bal${freshCls}">${fmtBal(usdc_b)}</td><td class="bal${freshCls}">${fmtBal(usd1_b)}</td><td class="bal${freshCls}">${fmtBal(quq_b)}</td><td class="bal${freshCls}">${fmtBal(qqqb_b)}</td><td class="bal${freshCls}">${fmtBal(bnb_b)}</td>`;
    }
    if(balOnly){
      const stable=[usdt_b,usdc_b,usd1_b];
      const total=stable.reduce((sum,v)=>sum+(v==null?0:Number(v)),0);
      html+=`<td class="usdt">${stable.some(v=>v==null)?'数据不完整':money(total)}</td>`;
    }
    html+=`<td><button class="btn-mini" id="rb-${r._idx}" onclick="refreshRow('${addr}',${r._idx})">🔄</button></td>`;
    tr.innerHTML=html;
    tbody.appendChild(tr);
  });
}
</script></body></html>
